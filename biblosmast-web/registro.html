<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblosmast | Crear cuenta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-pagina">
    <section class="login-lado" aria-hidden="true">
        <h2>Biblosmast</h2>
        <p>Crea tu cuenta para consultar el catálogo de la biblioteca.</p>
    </section>

    <main class="login-form">
        <div class="tarjeta">
            <h1>Crear cuenta</h1>
            <p class="sub">Completa tus datos</p>
            <div id="mensaje" class="mensaje error" hidden role="alert"></div>

            <form id="frmRegistro" novalidate>
                <div class="fila">
                    <div class="campo"><label for="documento">Documento</label><input id="documento" maxlength="20" required></div>
                    <div class="campo"><label for="telefono">Teléfono</label><input id="telefono" maxlength="20"></div>
                </div>
                <div class="fila">
                    <div class="campo"><label for="nombres">Nombres</label><input id="nombres" maxlength="80" required></div>
                    <div class="campo"><label for="apellidos">Apellidos</label><input id="apellidos" maxlength="80" required></div>
                </div>
                <div class="campo"><label for="email">Correo</label><input id="email" type="email" maxlength="120" required></div>
                <div class="campo"><label for="username">Nombre de usuario</label><input id="username" minlength="4" maxlength="40" autocomplete="username" required></div>
                <div class="fila">
                    <div class="campo"><label for="password">Contraseña</label><input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></div>
                    <div class="campo"><label for="confirmar">Repite la contraseña</label><input id="confirmar" type="password" maxlength="72" autocomplete="new-password" required></div>
                </div>
                <p class="nota">La contraseña debe tener mínimo 8 caracteres.</p>
                <button id="btnRegistro" class="btn bloque" type="submit">Crear cuenta</button>
            </form>
            <p class="enlaces-login"><a href="index.html">Ya tengo cuenta</a></p>
        </div>
    </main>
    <script type="module" src="js/registro.js"></script>
</body>
</html>
