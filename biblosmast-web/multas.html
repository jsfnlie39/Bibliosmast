<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblosmast | Multas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-pagina="multas">
    <main class="contenedor">
        <h1>Multas</h1>
        <p class="nota">Las multas se generan solas al devolver un ejemplar con retraso, dañado o perdido. Un usuario con multas pendientes no puede recibir nuevos préstamos.</p>
        <div id="mensaje" class="mensaje" hidden role="status"></div>

        <section id="panelValores" class="panel" hidden>
            <h2>Valores de las multas <small>(solo el administrador)</small></h2>
            <div id="camposValores"></div>
        </section>

        <div class="resumen">Total pendiente: <strong id="totalPendiente">—</strong></div>

        <div class="herramientas">
            <select id="filtroUsuario" aria-label="Filtrar por usuario"></select>
            <select id="filtroEstado" aria-label="Filtrar por estado">
                <option value="">Todas</option>
                <option value="PENDIENTE">Pendientes</option>
                <option value="PAGADA">Pagadas</option>
            </select>
        </div>

        <div class="tabla-wrap">
            <table>
                <thead>
                    <tr>
                        <th>N°</th><th>Usuario</th><th>Préstamo</th><th>Motivo</th>
                        <th>Valor</th><th>Estado</th><th>Fecha</th><th></th>
                    </tr>
                </thead>
                <tbody id="tbodyMultas"></tbody>
            </table>
        </div>
    </main>

    <script type="module" src="js/multas.js"></script>
</body>
</html>
