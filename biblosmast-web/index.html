<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblosmast | Iniciar sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-pagina">
    <main class="tarjeta">
        <h1>Biblosmast</h1>
        <p class="sub">Sistema de gestión de biblioteca</p>

        <div id="mensaje" class="mensaje error" hidden role="alert"></div>

        <form id="frmLogin" novalidate>
            <div class="campo">
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" autocomplete="username" maxlength="40" required autofocus>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
            </div>
            <button id="btnIngresar" class="btn bloque" type="submit">Ingresar</button>
        </form>
    </main>
    <script type="module" src="js/login.js"></script>
</body>
</html>
