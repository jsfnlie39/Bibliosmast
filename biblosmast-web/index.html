<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblosmast | Iniciar sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-pagina">
    <section class="login-lado" aria-hidden="true">
        <svg viewBox="0 0 360 260" role="img" aria-label="Estantería con libros">
            <rect x="20" y="214" width="320" height="10" rx="4" fill="#ffffff" opacity=".9"/>
            <rect x="40"  y="104" width="26" height="110" rx="3" fill="#6d98ff"/>
            <rect x="70"  y="84"  width="30" height="130" rx="3" fill="#ffffff"/>
            <rect x="104" y="120" width="24" height="94"  rx="3" fill="#ffd166"/>
            <rect x="132" y="94"  width="34" height="120" rx="3" fill="#4cc283"/>
            <rect x="170" y="70"  width="28" height="144" rx="3" fill="#ff7a7a"/>
            <rect x="202" y="110" width="30" height="104" rx="3" fill="#ffffff" opacity=".85"/>
            <rect x="236" y="88"  width="26" height="126" rx="3" fill="#6d98ff"/>
            <g transform="rotate(14 290 190)"><rect x="268" y="112" width="30" height="102" rx="3" fill="#ffd166"/></g>
            <circle cx="300" cy="52" r="26" fill="#ffffff" opacity=".14"/>
            <circle cx="60" cy="40" r="14" fill="#ffffff" opacity=".12"/>
            <path d="M48 70h28M48 78h20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".5"/>
        </svg>
        <h2>Biblosmast</h2>
        <p>Administra libros, préstamos, reservas y usuarios de tu biblioteca en un solo lugar.</p>
    </section>

    <main class="login-form">
        <div class="tarjeta">
            <h1>Iniciar sesión</h1>
            <p class="sub">Ingresa con tu usuario y contraseña</p>

            <div id="mensaje" class="mensaje error" hidden role="alert"></div>

            <form id="frmLogin" novalidate>
                <div class="campo">
                    <label for="username">Usuario o correo</label>
                    <input id="username" name="username" type="text" autocomplete="username" maxlength="120" required autofocus>
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
                </div>
                <button id="btnIngresar" class="btn bloque" type="submit">Ingresar</button>
            </form>
            <p class="enlaces-login">
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
                <a href="registro.html">Crear cuenta</a>
            </p>
        </div>
    </main>
    <script type="module" src="js/login.js"></script>
</body>
</html>
