server.port=8094

# --- Base de datos (credenciales por variables de entorno; no subir claves a GitLab) ---
spring.datasource.url=jdbc:mysql://localhost:3306/biblosmast?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA (misma estrategia de nombres del proyecto del profesor: la columna se llama como en el SQL) ---
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=debug

spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

# --- CORS: origenes del frontend (Live Server de VS Code), separados por coma ---
app.cors.origins=http://127.0.0.1:5500,http://localhost:5500
