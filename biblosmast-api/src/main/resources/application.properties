server.port=8094

# --- Base de datos (credenciales por variables de entorno; no subir claves a GitLab) ---
spring.datasource.url=jdbc:mysql://localhost:3306/biblosmast?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA (misma estrategia de nombres del proyecto del profesor: la columna se llama como en el SQL) ---
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=debug

spring.jackson.time-zone=America/Bogota
spring.jackson.locale=es_CO

# --- CORS: origenes del frontend, separados por coma (Live Server de VS Code y servidor de React) ---
app.cors.origins=http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:5173,http://localhost:5173

# --- JWT ---
# Clave con la que se firman los tokens (HS256): minimo 32 caracteres. Se pasa por la variable de entorno JWT_SECRET.
# Si no se define, se genera una al azar en cada arranque (los tokens dejan de servir al reiniciar la API).
jwt.secret=${JWT_SECRET:}
# Cuanto dura un token antes de vencer
jwt.expiracion-minutos=60

# --- Registro y recuperación de contraseña ---
# Dirección del frontend: se usa para armar el enlace del correo de recuperación
app.frontend-url=http://localhost:5173
# Cuánto dura un enlace de recuperación
recuperacion.minutos-validez=30
# Remitente de los correos
app.correo.remitente=${MAIL_FROM:no-reply@biblosmast.local}
# Para enviar correos de verdad, define estas variables de entorno (sin ellas, el enlace se muestra en la consola de la API):
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD

# --- Correo con Gmail (solo se usan si defines SPRING_MAIL_HOST; sin host sigue el modo consola) ---
# Gmail en el puerto 587 exige autenticación y STARTTLS; sin estas dos líneas el envío falla.
# Variables de entorno: SPRING_MAIL_HOST=smtp.gmail.com, SPRING_MAIL_PORT=587,
# SPRING_MAIL_USERNAME=tucuenta@gmail.com, SPRING_MAIL_PASSWORD=<contraseña de aplicación de 16 letras>,
# MAIL_FROM=tucuenta@gmail.com (Gmail reemplaza el remitente por la cuenta autenticada)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Tareas diarias (reservas vencidas y conteo de vencimientos) ---
# Para apagarlas: biblosmast.tareas.habilitadas=false. Hora: formato cron de Spring (segundo minuto hora día mes día-semana).
biblosmast.tareas.habilitadas=true
biblosmast.tareas.cron=0 0 2 * * *
biblosmast.tareas.zona=America/Bogota

# --- Avisos de vencimiento ---
# Días de anticipación para avisar que un préstamo está por vencer (2 = avisa 2 días antes, 1 día antes y el mismo día).
biblosmast.avisos.dias-anticipacion=2
# Además del aviso dentro del sistema (la campana), se envía por correo (con SPRING_MAIL_HOST; sin servidor sale en la consola).
biblosmast.avisos.correo=true
